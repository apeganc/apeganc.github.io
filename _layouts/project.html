<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} – Anka Peganc</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}

  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">

  <link rel="preload" href="{{ '/fonts/lexend-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/fonts/agrave-pro-600.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <style>
    /* The page template for the project READMEs in projects/. Same fonts and colours as index.html. */
    @font-face {
      font-family: "Lexend";
      font-weight: 400;
      font-display: swap;
      src: url({{ '/fonts/lexend-latin-ext-400-normal.woff2' | relative_url }}) format("woff2");
      unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
    }
    @font-face {
      font-family: "Lexend";
      font-weight: 400;
      font-display: swap;
      src: url({{ '/fonts/lexend-latin-400-normal.woff2' | relative_url }}) format("woff2");
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: "Lexend";
      font-weight: 600;
      font-display: swap;
      src: url({{ '/fonts/lexend-latin-ext-600-normal.woff2' | relative_url }}) format("woff2");
      unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
    }
    @font-face {
      font-family: "Lexend";
      font-weight: 600;
      font-display: swap;
      src: url({{ '/fonts/lexend-latin-600-normal.woff2' | relative_url }}) format("woff2");
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: "Agrave Pro";
      font-weight: 600;
      font-display: swap;
      src: url({{ '/fonts/agrave-pro-600.woff2' | relative_url }}) format("woff2");
    }

    :root {
      /* Oceanic Cactus */
      --teal: #22525b;
      --turquoise: #5ccbc3;
      --mint: #f7fff7;
      --coral: #db4c47; /* the palette's #f9736f, darkened to 4:1 contrast on mint so it reads well as text */
      --yellow: #fae775;
      --dark-turquoise: #2b6662;
      --muted: #4a7076;
      --tint: #e6f5f2; /* a whisper of turquoise, for notes and code */
      --line: rgba(34, 82, 91, 0.15);
    }

    * { box-sizing: border-box; }

    html {
      font-size: 106.25%; /* 17px */
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--mint);
      color: var(--teal);
      font-family: "Lexend", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
      line-height: 1.65;
    }

    ::selection { background: var(--yellow); color: var(--teal); }

    .site, main {
      width: 100%;
      max-width: 39.5rem;
      margin: 0 auto;
      padding: 0 1.25rem;
    }
    .site { padding-top: 2.5rem; }
    main { flex: 1 0 auto; }

    a {
      color: var(--dark-turquoise);
      font-weight: 600;
      text-decoration-line: none;
      text-decoration-thickness: 2px;
      text-underline-offset: 0.22em;
    }
    a:hover { text-decoration-line: underline; text-decoration-color: var(--coral); }
    a:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Your name at the top, linking back to the main page */
    .home {
      font-family: "Agrave Pro", "Lexend", sans-serif;
      font-size: 2.1rem;
      font-weight: 600;
      line-height: 1.1;
      color: var(--coral);
    }

    /* The README itself */
    h1, h2, h3 { line-height: 1.2; font-weight: 600; margin: 0; }
    h1 { font-size: 2rem; margin-top: 2rem; }
    h2 { font-size: 1.35rem; margin-top: 2.5rem; }
    h3 { font-size: 1.12rem; margin-top: 1.75rem; }
    p, ul, ol, table, blockquote { margin: 0.75rem 0 0; }
    ul, ol { padding-left: 1.2rem; }
    li + li { margin-top: 0.35rem; }
    strong, b { font-weight: 600; }

    blockquote {
      padding: 0.85rem 1.1rem;
      background: var(--tint);
      border-radius: 8px;
    }
    blockquote p { margin: 0; }

    code {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.86em;
      padding: 0.1em 0.35em;
      background: var(--tint);
      border-radius: 4px;
    }

    /* "Built with" tables: the "Area / Tools" header row is for screen readers
       and GitHub's file view; on the page the "Built with" heading says enough */
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    td {
      padding: 0.55rem 1rem 0.55rem 0;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    td:first-child {
      width: 9.5rem;
      font-weight: 600;
    }
    tr:last-child td { border-bottom: 0; }

    hr {
      margin: 2.75rem 0 0;
      border: 0;
      border-top: 1px solid var(--coral);
    }

    footer {
      margin-top: 4rem;
      padding: 2.5rem 1.25rem 3rem;
      background: var(--teal);
      color: var(--mint);
      font-size: 1.15rem;
    }
    footer p {
      max-width: 37rem;
      margin: 0 auto;
    }
    footer a { color: var(--yellow); }
    footer a:focus-visible { outline-color: var(--yellow); }
    footer .social {
      display: flex;
      gap: 0.9rem;
      max-width: 37rem;
      margin: 1.1rem auto 0;
      padding: 0;
      list-style: none;
    }
    footer .social li + li { margin-top: 0; }
    footer .social li:first-child a { margin-left: -0.3rem; }
    footer .social a {
      display: block;
      padding: 0.3rem;
      border-radius: 6px;
    }
    footer .social img {
      display: block;
      width: 1.6rem;
      height: 1.6rem;
      object-fit: contain;
      filter: invert(1);
    }
    footer .social a:hover img { opacity: 0.75; }
    footer .copyright {
      margin-top: 1.75rem;
      font-size: 0.85rem;
      color: #c9dcd6;
    }

    @media (max-width: 34rem) {
      .site { padding-top: 1.75rem; }
      .home { font-size: 1.85rem; }
      h1 { font-size: 1.7rem; }
      td:first-child { width: 7.5rem; }
    }
  </style>
</head>
<body>
  <header class="site">
    <a class="home" href="{{ '/' | relative_url }}">Anka Peganc</a>
  </header>

  <main>
{{ content }}
  </main>

  <footer>
    <p>You can reach me at <a href="mailto:anka@crunchy.si">anka@crunchy.si</a>.</p>
    <ul class="social">
      <li><a href="https://www.linkedin.com/in/anka-peganc-8a545b34a/" rel="me" aria-label="LinkedIn" title="LinkedIn"><img src="{{ '/icons/linkedin.svg' | relative_url }}" alt="" width="27" height="27"></a></li>
      <li><a href="https://github.com/apeganc" rel="me" aria-label="GitHub" title="GitHub"><img src="{{ '/icons/github.svg' | relative_url }}" alt="" width="27" height="27"></a></li>
      <li><a href="https://www.instagram.com/anka_peganc/" rel="me" aria-label="Instagram" title="Instagram"><img src="{{ '/icons/instagram.svg' | relative_url }}" alt="" width="27" height="27"></a></li>
      <li><a href="https://www.facebook.com/anka.peganc" rel="me" aria-label="Facebook" title="Facebook"><img src="{{ '/icons/facebook.svg' | relative_url }}" alt="" width="27" height="27"></a></li>
    </ul>
    <p class="copyright">© 2026 Anka Peganc</p>
  </footer>
</body>
</html>
